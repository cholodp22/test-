name: bot

on:
  # cron — github actions minimum interval is 5 minutes
  schedule:
    - cron: "2-59/5 * * * *"  # every 5 min, offset from :00 to avoid github top-of-hour load
  # manual: poll / list / add @user / remove @user
  workflow_dispatch:
    inputs:
      action:
        description: "what to do"
        type: choice
        required: true
        default: poll
        options:
          - poll
          - list
          - add
          - remove
      username:
        description: "username for add/remove (with or without @)"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  actions: write  # needed for self-reschedule via workflow_dispatch

# avoid overlapping runs (each cycle takes ~1 min for 27 accounts)
concurrency:
  group: bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: pip install --no-cache-dir -r requirements.txt

      - name: run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          POLL_INTERVAL_SECONDS: "180"
          TWEETS_PER_POLL: "20"
          REQUEST_DELAY_SECONDS: "2.5"
          ACTION: ${{ github.event.inputs.action || 'poll' }}
          USERNAME: ${{ github.event.inputs.username || '' }}
        run: |
          if [ -n "$USERNAME" ]; then
            python -m bot.cron --action "$ACTION" --username "$USERNAME"
          else
            python -m bot.cron --action "$ACTION"
          fi

      - name: commit state if changed
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "bot: update state [skip ci]"
            # use --force-with-lease to avoid stomping concurrent edits
            git push --force-with-lease
          else
            echo "no state changes — skipping commit"
          fi

      - name: self-reschedule (bootstrap chain if github's lazy scheduler stalls)
        if: ${{ (github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'poll' || github.event.inputs.action == '')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # github's `schedule` event can be hours-delayed for new workflows on freshly-changed default branches.
          # this step keeps a self-sustaining chain alive: sleep ~4.5 min, then dispatch self for the next ~5-min tick.
          # if a run ever fails before reaching this step, the chain breaks; the cron schedule above is the safety net.
          sleep 270
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches" \
            -d '{"ref":"dev","inputs":{"action":"poll","username":""}}'
